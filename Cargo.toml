# SPDX-License-Identifier: AGPL-3.0-or-later
[package]
name = "mb-printer-cli"
version = "0.1.0"
edition = "2024"
license = "AGPL-3.0-or-later"
description = "Native CLI and authenticated loopback service for Makers' Brain printers"
repository = "https://github.com/makersbrain/mb-printer-cli"
homepage = "https://makersbrain.com"
documentation = "https://github.com/makersbrain/mb-printer-cli/tree/main/docs"
readme = "README.md"
rust-version = "1.88"
categories = ["command-line-utilities", "hardware-support"]
keywords = ["label", "printer", "thermal", "escpos", "brother"]
include = ["src/**", "tests/**", "docs/**", ".github/**", "Cargo.toml", "Cargo.lock", "README.md", "CHANGELOG.md", "LICENSE", "NOTICE.md", "THIRD_PARTY_LICENSES.md"]

[features]
default = []
usb = ["dep:rusb"]
bluetooth = ["dep:btleplug", "mb-printer-native/ble", "mb-printer-native/bluetooth-rfcomm"]

[[bin]]
name = "mb-printer"
path = "src/main.rs"

[dependencies]
axum = { version = "0.8.9", features = ["json", "macros"] }
base64 = "0.22.1"
clap = { version = "4.6.6", features = ["derive", "env"] }
chrono = { version = "0.4.45", default-features = false, features = ["clock"] }
csv = "1.3.1"
http = "1.4.0"
mb-printer-core = { version = "0.1.0", path = "../mb-printer-sdk/crates/mb-printer-core" }
mb-printer-native = { version = "0.1.0", path = "../mb-printer-sdk/crates/mb-printer-native", default-features = false }
image = { version = "0.25.10", default-features = false, features = ["png"] }
rand = "0.9.2"
rusb = { version = "0.9.4", optional = true, features = ["vendored"] }
btleplug = { version = "0.11.8", optional = true }
futures-util = "0.3.34"
serialport = { version = "4.8.1", default-features = false }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
sha2 = "0.10.9"
subtle = "2.6.1"
thiserror = "2.0.18"
tempfile = "3.27.0"
tokio = { version = "1.53.1", features = ["macros", "rt-multi-thread", "net", "signal", "sync", "time"] }
tokio-stream = { version = "0.1.19", features = ["sync"] }
tower-http = { version = "0.6.11", features = ["cors", "limit", "trace"] }
uuid = { version = "1.24.0", features = ["v4", "serde"] }
walkdir = "2.5.0"
zip = "8.2.0"

[dev-dependencies]
http-body-util = "0.1.4"
serde_yaml = "0.9.34"
tower = { version = "0.5.3", features = ["util"] }

[profile.release]
lto = "thin"
strip = true
