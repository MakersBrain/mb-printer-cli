# SPDX-License-Identifier: AGPL-3.0-or-later
openapi: 3.1.0
info:
  title: mb-printer loopback API
  version: 1.0.0
  license: {name: AGPL-3.0-or-later, identifier: AGPL-3.0-or-later}
servers: [{url: "http://127.0.0.1:9847"}, {url: "http://[::1]:9847"}]
security: [{bearer: []}]
paths:
  /v1/pair:
    post: {operationId: pair, security: [], requestBody: {$ref: "#/components/requestBodies/Pair"}, responses: {"200": {$ref: "#/components/responses/Pair"}, "401": {$ref: "#/components/responses/Error"}}}
  /v1/admin/pair:
    post: {operationId: pairAdmin, description: "Exchanges a one-time secret created locally with `mb-printer service pair-admin`. Administrator pairing must be explicitly enabled locally through enable_brother_wifi_configuration_pairing before a secret can be issued or exchanged; Wi-Fi mutation separately requires enable_brother_wifi_configuration. It only accepts an administrator pairing secret and returns a maximum ten-minute origin-bound administrator bearer token. The response is not cacheable.", security: [], requestBody: {$ref: "#/components/requestBodies/Pair"}, responses: {"200": {description: Short-lived administrator bearer grant, headers: {Cache-Control: {$ref: "#/components/headers/NoStore"}}, content: {application/json: {schema: {$ref: "#/components/schemas/PairResponse"}}}}, "401": {$ref: "#/components/responses/Error"}, "403": {$ref: "#/components/responses/Error"}}}
  /v1/grants/me:
    get: {operationId: currentGrant, responses: {"200": {description: Current origin-bound grant, content: {application/json: {schema: {$ref: "#/components/schemas/Grant"}}}}, "401": {$ref: "#/components/responses/Error"}}}
  /v1/grants/me/rotate:
    post: {operationId: rotateCurrentGrant, requestBody: {required: true, content: {application/json: {schema: {$ref: "#/components/schemas/RotateGrantRequest"}}}}, responses: {"200": {description: One-time replacement bearer secret, content: {application/json: {schema: {$ref: "#/components/schemas/RotatedGrant"}}}}}}
  /v1/grants/me/revoke:
    post: {operationId: revokeCurrentGrant, responses: {"204": {description: Current grant revoked}}}
  /v1/capabilities:
    get: {operationId: capabilities, responses: {"200": {description: Service capabilities, content: {application/json: {schema: {$ref: "#/components/schemas/Capabilities"}}}}}}
  /v1/printers:
    get: {operationId: printers, responses: {"200": {description: Configured, discovered and bundled printers, headers: {Cache-Control: {$ref: "#/components/headers/NoStore"}}, content: {application/json: {schema: {$ref: "#/components/schemas/PrintersResponse"}}}}}}
  /v1/discovery:
    post: {operationId: discoverPrinters, responses: {"200": {description: Native discovery results, headers: {Cache-Control: {$ref: "#/components/headers/NoStore"}}, content: {application/json: {schema: {$ref: "#/components/schemas/DiscoveryResponse"}}}}}}
  /v1/connection:
    post: {operationId: saveConnection, requestBody: {required: true, content: {application/json: {schema: {$ref: "#/components/schemas/ConnectionInput"}}}}, responses: {"200": {description: Probed and persisted connection with transport-derived read-only operations, headers: {Cache-Control: {$ref: "#/components/headers/NoStore"}}, content: {application/json: {schema: {$ref: "#/components/schemas/Connection"}}}}, "422": {$ref: "#/components/responses/Error"}}}
  /v1/status:
    get: {operationId: printerStatus, parameters: [{name: connection, in: query, schema: {type: string}}], responses: {"200": {description: Live selected connection status and media, headers: {Cache-Control: {$ref: "#/components/headers/NoStore"}}, content: {application/json: {schema: {$ref: "#/components/schemas/StatusResponse"}}}}}}
  /v1/printers/{connection}/brother/wifi/status:
    get: {operationId: brotherWirelessStatus, parameters: [{$ref: "#/components/parameters/ConnectionId"}], responses: {"200": {description: Live Brother wireless state, headers: {Cache-Control: {$ref: "#/components/headers/NoStore"}}, content: {application/json: {schema: {$ref: "#/components/schemas/BrotherWirelessStatus"}}}}, "404": {$ref: "#/components/responses/Error"}, "422": {$ref: "#/components/responses/Error"}, "502": {$ref: "#/components/responses/Error"}}}
  /v1/printers/{connection}/brother/wifi/scan:
    post: {operationId: brotherWirelessScan, parameters: [{$ref: "#/components/parameters/ConnectionId"}], responses: {"200": {description: Nearby access points observed by the Brother printer, headers: {Cache-Control: {$ref: "#/components/headers/NoStore"}}, content: {application/json: {schema: {$ref: "#/components/schemas/BrotherWirelessScanResponse"}}}}, "404": {$ref: "#/components/responses/Error"}, "422": {$ref: "#/components/responses/Error"}, "502": {$ref: "#/components/responses/Error"}}}
  /v1/printers/{connection}/brother/wifi/prepare:
    post: {operationId: prepareBrotherWirelessConfiguration, description: "Requires a short-lived administrator grant. Stores only an opaque fingerprint of the requested settings for local confirmation; the password is never returned or persisted.", parameters: [{$ref: "#/components/parameters/ConnectionId"}], requestBody: {required: true, content: {application/json: {schema: {$ref: "#/components/schemas/BrotherWirelessSettings"}}}}, responses: {"200": {description: Non-secret review and one-time local approval ID, headers: {Cache-Control: {$ref: "#/components/headers/NoStore"}}, content: {application/json: {schema: {$ref: "#/components/schemas/BrotherWirelessPrepareResponse"}}}}, "401": {$ref: "#/components/responses/Error"}, "404": {$ref: "#/components/responses/Error"}, "422": {$ref: "#/components/responses/Error"}}}
  /v1/printers/{connection}/brother/wifi/configure:
    post: {operationId: configureBrotherWireless, description: "Requires the same short-lived administrator grant and an unexpired, locally approved, one-time approval ID returned by prepare. USB only; an approval is consumed before the command is attempted.", parameters: [{$ref: "#/components/parameters/ConnectionId"}], requestBody: {required: true, content: {application/json: {schema: {$ref: "#/components/schemas/BrotherWirelessConfigureRequest"}}}}, responses: {"200": {description: Configuration command accepted by the locally attached printer, headers: {Cache-Control: {$ref: "#/components/headers/NoStore"}}, content: {application/json: {schema: {$ref: "#/components/schemas/BrotherWirelessConfigureResponse"}}}}, "401": {$ref: "#/components/responses/Error"}, "404": {$ref: "#/components/responses/Error"}, "409": {$ref: "#/components/responses/Error"}, "422": {$ref: "#/components/responses/Error"}, "502": {$ref: "#/components/responses/Error"}}}
  /v1/printers/{connection}/brother/report:
    get: {operationId: brotherSystemReport, parameters: [{$ref: "#/components/parameters/ConnectionId"}], responses: {"200": {description: Redacted Brother system configuration report, headers: {Cache-Control: {$ref: "#/components/headers/NoStore"}}, content: {application/json: {schema: {$ref: "#/components/schemas/BrotherSystemReport"}}}}, "404": {$ref: "#/components/responses/Error"}, "422": {$ref: "#/components/responses/Error"}, "502": {$ref: "#/components/responses/Error"}}}
  /v1/documents/validate:
    post: {operationId: validateDocument, requestBody: {$ref: "#/components/requestBodies/Document"}, responses: {"200": {description: Validation result, content: {application/json: {schema: {$ref: "#/components/schemas/ValidationResult"}}}}, "413": {$ref: "#/components/responses/Error"}}}
  /v1/documents/preview:
    post:
      operationId: previewDocument
      parameters: [{name: zoom, in: query, schema: {type: number, exclusiveMinimum: 0, default: 1}}, {name: offsetX, in: query, schema: {type: number, default: 0}}, {name: offsetY, in: query, schema: {type: number, default: 0}}]
      requestBody: {$ref: "#/components/requestBodies/Document"}
      responses: {"200": {description: Media-sized PNG viewport, content: {image/png: {schema: {type: string, contentEncoding: binary}}}}, "422": {$ref: "#/components/responses/Error"}}
  /v1/documents/export:
    post:
      operationId: exportDocument
      parameters: [{name: format, in: query, required: true, schema: {type: string, enum: [png, pdf]}}]
      requestBody: {$ref: "#/components/requestBodies/Document"}
      responses: {"200": {description: PNG or exact-geometry PDF, content: {image/png: {schema: {type: string, contentEncoding: binary}}, application/pdf: {schema: {type: string, contentEncoding: binary}}}}, "422": {$ref: "#/components/responses/Error"}}
  /v1/jobs:
    post:
      operationId: submitJob
      parameters: [{name: Idempotency-Key, in: header, schema: {type: string, minLength: 1, maxLength: 128}}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: "#/components/schemas/JobRequest"}}}}
      responses: {"202": {$ref: "#/components/responses/Job"}, "200": {$ref: "#/components/responses/Job"}, "409": {$ref: "#/components/responses/Error"}, "422": {$ref: "#/components/responses/Error"}}
  /v1/jobs/{id}:
    get: {operationId: getJob, parameters: [{$ref: "#/components/parameters/JobId"}], responses: {"200": {$ref: "#/components/responses/Job"}, "404": {$ref: "#/components/responses/Error"}}}
  /v1/jobs/{id}/events:
    get: {operationId: jobEvents, parameters: [{$ref: "#/components/parameters/JobId"}], responses: {"200": {description: Initial snapshot and progress stream, content: {text/event-stream: {schema: {type: string}}}}, "404": {$ref: "#/components/responses/Error"}}}
  /v1/jobs/{id}/cancel:
    post: {operationId: cancelJob, parameters: [{$ref: "#/components/parameters/JobId"}], responses: {"200": {$ref: "#/components/responses/Job"}, "404": {$ref: "#/components/responses/Error"}}}
  /v1/assets:
    get: {operationId: installedAssets, responses: {"200": {description: Installed private catalogues, content: {application/json: {schema: {$ref: "#/components/schemas/AssetsResponse"}}}}}}
  /v1/laposte/extract:
    post: {operationId: extractLaposte, requestBody: {required: true, content: {application/json: {schema: {$ref: "#/components/schemas/LaposteRequest"}}}}, responses: {"200": {description: Selected occupied stamps, content: {application/json: {schema: {$ref: "#/components/schemas/LaposteResponse"}}}}, "422": {$ref: "#/components/responses/Error"}}}
components:
  securitySchemes: {bearer: {type: http, scheme: bearer}}
  headers:
    NoStore: {description: Device-derived responses are never retained by browsers or intermediaries, schema: {type: string, const: no-store}}
  parameters:
    JobId: {name: id, in: path, required: true, schema: {type: string, format: uuid}}
    ConnectionId: {name: connection, in: path, required: true, schema: {type: string, minLength: 1}}
  requestBodies:
    Pair: {required: true, content: {application/json: {schema: {type: object, additionalProperties: false, required: [secret], properties: {secret: {type: string}}}}}}
    Document: {required: true, content: {application/json: {schema: {$ref: "#/components/schemas/Document"}}}}
  responses:
    Pair: {description: Origin-bound bearer grant, content: {application/json: {schema: {$ref: "#/components/schemas/PairResponse"}}}}
    Job: {description: Persisted job state, content: {application/json: {schema: {$ref: "#/components/schemas/Job"}}}}
    Error: {description: Request rejected, content: {application/json: {schema: {$ref: "#/components/schemas/Error"}}}}
  schemas:
    Error: {type: object, additionalProperties: false, required: [error], properties: {error: {type: string}}}
    PairResponse: {type: object, additionalProperties: false, required: [grantId, token, expiresAt], properties: {grantId: {type: string, format: uuid}, token: {type: string}, expiresAt: {type: string, format: date-time}}}
    Grant: {type: object, additionalProperties: false, required: [id, origin, createdAt, expiresAt], properties: {id: {type: string, format: uuid}, origin: {type: string, format: uri}, createdAt: {type: integer}, expiresAt: {type: integer}, revokedAt: {type: [integer, "null"]}}}
    RotateGrantRequest: {type: object, additionalProperties: false, properties: {expiresSeconds: {type: integer, minimum: 1, maximum: 31536000, default: 2592000}}}
    RotatedGrant: {type: object, additionalProperties: false, required: [grantId, token, expiresIn], properties: {grantId: {type: string, format: uuid}, token: {type: string}, expiresIn: {type: integer}}}
    Document:
      type: object
      required: [version, media, coordinateSystem, elements, resources, fields]
      properties:
        version: {type: integer, const: 4}
        name: {type: string}
        media: {type: object, required: [width, height, unit, dpi], properties: {width: {type: number, exclusiveMinimum: 0}, height: {type: number, exclusiveMinimum: 0}, unit: {type: string, enum: [micrometre, mm]}, dpi: {type: integer, minimum: 1}}}
        coordinateSystem: {type: object}
        elements: {type: array, items: {type: object}}
        resources: {type: array, items: {type: object}}
        fields: {type: array, items: {type: object}}
    ValidationResult: {type: object, additionalProperties: false, required: [valid, errors], properties: {valid: {type: boolean}, errors: {type: array, items: {type: string}}}}
    Capabilities: {type: object, additionalProperties: false, required: [service, version, api, features, max_document_bytes, printer_definition_count], properties: {service: {const: mb-printer}, version: {type: string}, api: {const: v1}, features: {type: array, items: {type: string}}, max_document_bytes: {type: integer}, printer_definition_count: {type: integer}}}
    NetworkDiscoveryDetails: {type: object, additionalProperties: false, required: [scheme, host, port, resource, addresses, serviceName], properties: {scheme: {type: string, enum: [ipp, ipps]}, host: {type: string}, port: {type: integer, minimum: 1, maximum: 65535}, resource: {type: string, pattern: "^/"}, addresses: {type: array, maxItems: 16, items: {type: string}}, serviceName: {type: string}, makeAndModel: {type: string}}}
    PrinterOperation: {type: string, enum: [print, status, system-report, wifi-status, wifi-scan, wifi-configure, ipp-status, dns-sd-discovery]}
    NativeDevice: {type: object, required: [transport, address], properties: {transport: {type: string}, address: {type: string, description: Full ipp:// or ipps:// URI for DNS-SD IPP candidates}, name: {type: [string, "null"]}, vendor_id: {type: integer}, product_id: {type: integer}, serial_number: {type: string}, ieee1284_device_id: {type: string}, network: {$ref: "#/components/schemas/NetworkDiscoveryDetails"}, matchedModel: {type: [string, "null"]}, operations: {type: array, description: Transport-derived operations safe for this discovered endpoint. Wi-Fi configuration is advertised only when enable_brother_wifi_configuration is enabled locally and for USB QL-1110NWB or QL-1115NWB; its route separately requires an administrator grant and local one-time approval., items: {$ref: "#/components/schemas/PrinterOperation"}}}}
    DiscoveryResponse: {type: object, additionalProperties: false, required: [devices, supportedTransports], properties: {devices: {type: array, items: {$ref: "#/components/schemas/NativeDevice"}}, supportedTransports: {type: array, items: {type: string, enum: [file, tcp, serial, usb, ble, rfcomm, ipp]}}}}
    PrintersResponse: {type: object, additionalProperties: false, required: [printers, definitions], properties: {printers: {type: object, required: [discovered, configured], properties: {discovered: {type: array, items: {type: object, required: [source, device, operations], properties: {source: {const: discovery}, device: {$ref: "#/components/schemas/NativeDevice"}, matchedModel: {type: [string, "null"]}, operations: {type: array, items: {$ref: "#/components/schemas/PrinterOperation"}}}}}, configured: {type: array, items: {$ref: "#/components/schemas/Connection"}}}}, definitions: {type: array, items: {type: object, required: [id, name, protocol, dpi]}}}}
    StatusResponse: {type: object, required: [connected, status, media], properties: {connection: {$ref: "#/components/schemas/Connection"}, connections: {type: array, items: {$ref: "#/components/schemas/Connection"}}, connected: {type: boolean}, status: {type: string}, media: {type: [object, "null"]}}}
    BrotherWirelessStatus: {type: object, additionalProperties: false, required: [connected, ipAddress, ssid, encryption, authentication, infrastructure, wirelessDirect], properties: {connected: {type: [boolean, "null"]}, ipAddress: {type: [string, "null"]}, ssid: {type: [string, "null"]}, encryption: {type: [string, "null"], enum: [none, wep, tkip, aes, ckip, cmic, ckip-cmic, tkip-aes, null]}, authentication: {type: [string, "null"], enum: [open, shared-key, wpa-psk, leap, eap-fast, peap, eap-ttls, eap-tls, wpa-only, wpa2-only, null]}, infrastructure: {type: [boolean, "null"]}, wirelessDirect: {type: [boolean, "null"]}}}
    BrotherAccessPoint: {type: object, additionalProperties: false, required: [ssid, channel, power, enterprise, encrypted], properties: {ssid: {type: string}, channel: {type: integer, minimum: 0, maximum: 255}, power: {type: integer}, enterprise: {type: boolean}, encrypted: {type: boolean}}}
    BrotherWirelessScanResponse: {type: object, additionalProperties: false, required: [accessPoints], properties: {accessPoints: {type: array, items: {$ref: "#/components/schemas/BrotherAccessPoint"}}}}
    BrotherWirelessSettings: {type: object, additionalProperties: false, required: [ssid, password, encryption, authentication], properties: {ssid: {type: string, minLength: 1}, password: {type: string, writeOnly: true}, encryption: {type: string, enum: [none, wep, tkip, aes, ckip, cmic, ckip-cmic, tkip-aes]}, authentication: {type: string, enum: [open, shared-key, wpa-psk, leap, eap-fast, peap, eap-ttls, eap-tls, wpa-only, wpa2-only]}, infrastructure: {type: boolean, default: true}, wirelessDirect: {type: boolean, default: false}, reboot: {type: boolean, default: true}}}
    BrotherWirelessPrepareResponse: {type: object, additionalProperties: false, required: [approvalId, expiresAt, connection, device, ssid, encryption, authentication, infrastructure, wirelessDirect, reboot, recovery], properties: {approvalId: {type: string, format: uuid}, expiresAt: {type: integer}, connection: {type: string}, device: {type: string, description: Stable USB selector}, ssid: {type: string}, encryption: {type: string}, authentication: {type: string}, infrastructure: {type: boolean}, wirelessDirect: {type: boolean}, reboot: {type: boolean}, recovery: {type: string}}}
    BrotherWirelessConfigureRequest: {type: object, additionalProperties: false, required: [approvalId, ssid, password, encryption, authentication], properties: {approvalId: {type: string, format: uuid}, ssid: {type: string, minLength: 1}, password: {type: string, writeOnly: true}, encryption: {type: string, enum: [none, wep, tkip, aes, ckip, cmic, ckip-cmic, tkip-aes]}, authentication: {type: string, enum: [open, shared-key, wpa-psk, leap, eap-fast, peap, eap-ttls, eap-tls, wpa-only, wpa2-only]}, infrastructure: {type: boolean, default: true}, wirelessDirect: {type: boolean, default: false}, reboot: {type: boolean, default: true}}}
    BrotherWirelessConfigureResponse: {type: object, additionalProperties: false, required: [connection, device, applied, reboot], properties: {connection: {type: string}, device: {type: string}, applied: {const: true}, reboot: {type: boolean}}}
    BrotherSystemReport: {type: object, additionalProperties: false, required: [text, sections], properties: {text: {type: string, description: Redacted report text}, sections: {type: object, additionalProperties: {type: object, additionalProperties: {type: string}}}}}
    AssetsResponse: {type: object, additionalProperties: false, required: [catalogues, visibility], properties: {catalogues: {type: array, items: {type: object}}, visibility: {const: private-local-only}}}
    Transport:
      oneOf:
        - {type: object, additionalProperties: false, required: [kind], properties: {kind: {const: capture}}}
        - {type: object, additionalProperties: false, required: [kind, path], properties: {kind: {const: file}, path: {type: string}}}
        - {type: object, additionalProperties: false, required: [kind, address], properties: {kind: {const: tcp}, address: {type: string}}}
        - {type: object, additionalProperties: false, required: [kind, uri], properties: {kind: {const: ipp}, uri: {type: string, pattern: "^ipps?://"}, certificatePem: {type: string, description: Optional trusted CA or self-signed certificate PEM for IPPS}}}
        - {type: object, additionalProperties: false, required: [kind, path], properties: {kind: {const: serial}, path: {type: string}, baud: {type: integer, default: 115200}}}
        - {type: object, additionalProperties: false, required: [kind, address], properties: {kind: {const: rfcomm}, address: {type: string}, channel: {type: integer, minimum: 1, maximum: 30, default: 1}}}
        - {type: object, additionalProperties: false, required: [kind, device], properties: {kind: {const: usb}, device: {type: string, pattern: "^(usb-device:[0-9a-fA-F]{4}:[0-9a-fA-F]{4}:[0-9]{3}:[0-9]{3}|[^:]+)$"}}}
        - {type: object, required: [kind, vid, pid, interface, out], properties: {kind: {const: usb}, vid: {type: integer}, pid: {type: integer}, interface: {type: integer}, out: {type: integer}, input: {type: [integer, "null"]}}}
        - {type: object, additionalProperties: false, required: [kind, address], properties: {kind: {const: ble}, address: {type: string}}}
    ConnectionInput: {type: object, additionalProperties: false, required: [id, model, transport], properties: {id: {type: string}, model: {type: string}, transport: {$ref: "#/components/schemas/Transport"}}}
    Connection: {type: object, required: [id, model, transport, status, operations], properties: {id: {type: string}, model: {type: string}, transport: {$ref: "#/components/schemas/Transport"}, status: {type: string}, media: {type: [object, "null"]}, operations: {type: array, description: Operations derived from the model and concrete transport; this is response metadata and is not persisted in connection files., items: {$ref: "#/components/schemas/PrinterOperation"}}}}
    JobRequest:
      type: object
      required: [document]
      oneOf: [{required: [connectionId]}, {required: [transport, model]}]
      properties: {document: {$ref: "#/components/schemas/Document"}, model: {type: string}, printerId: {type: string, deprecated: true}, connectionId: {type: string}, dpi: {type: integer, minimum: 1}, rotation: {type: integer, enum: [0, 90, 180, 270], default: 0}, fit: {type: boolean, default: false}, density: {type: integer, minimum: 1, maximum: 8, default: 6}, copies: {type: integer, minimum: 1, default: 1}, payloadLimit: {type: integer, minimum: 1, default: 512}, transport: {$ref: "#/components/schemas/Transport"}}
    Job: {type: object, additionalProperties: false, required: [id, state, terminal, lastCompletedAction, bytesSent, action, actions, totalBytes, phase], properties: {id: {type: string, format: uuid}, state: {type: string, enum: [queued, running, cancel-requested, cancelled-before-send, cancelled-partial, outcome-unknown, completed, failed]}, terminal: {type: boolean}, outcome: {type: [string, "null"]}, lastCompletedAction: {type: integer}, bytesSent: {type: integer}, action: {type: integer}, actions: {type: integer}, totalBytes: {type: integer}, phase: {type: string}, error: {type: [string, "null"]}}}
    LaposteRequest: {type: object, additionalProperties: false, required: [pdfBase64, format], properties: {pdfBase64: {type: string, contentEncoding: base64}, format: {type: string, enum: [L24A, L24B, L21A, L18A, L16A, L14A, L12A, SHEET]}, dpi: {type: integer, minimum: 1, default: 300}, pages: {type: array, items: {type: integer, minimum: 1}}, slots: {type: array, items: {type: string, pattern: "^[1-9][0-9]*:[1-9][0-9]*$"}}}}
    Stamp: {type: object, required: [page, slot, widthUm, heightUm, raster], properties: {page: {type: integer}, slot: {type: integer}, widthUm: {type: integer, const: 63500}, heightUm: {type: integer, const: 33900}, raster: {type: object, required: [width, height, pixelsBase64], properties: {width: {type: integer}, height: {type: integer}, pixelsBase64: {type: string, contentEncoding: base64}}}}}
    LaposteResponse: {type: object, additionalProperties: false, required: [stamps], properties: {stamps: {type: array, minItems: 1, items: {$ref: "#/components/schemas/Stamp"}}}}
