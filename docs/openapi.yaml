openapi: 3.1.0
info: {title: mb-printer loopback API, version: 1.0.0}
servers: [{url: "http://127.0.0.1:9847"}]
paths:
  /v1/pair:
    post: {summary: Exchange a one-time secret for an origin-bound token}
  /v1/capabilities:
    get: {summary: SDK and service capabilities, security: [{bearer: []}]}
  /v1/discovery:
    post: {summary: Discover native printer transports, security: [{bearer: []}]}
  /v1/connection:
    post: {summary: Persist a bounded connection definition, security: [{bearer: []}]}
  /v1/status:
    get: {summary: Read configured connection status and media, security: [{bearer: []}]}
  /v1/jobs:
    post: {summary: Submit an editor or canonical v4 document, security: [{bearer: []}]}
  /v1/jobs/{id}:
    get:
      summary: Poll persisted job progress or terminal outcome
      security: [{bearer: []}]
      parameters: [{name: id, in: path, required: true, schema: {type: string, format: uuid}}]
  /v1/jobs/{id}/events:
    get:
      summary: Stream job progress as server-sent events
      security: [{bearer: []}]
      parameters: [{name: id, in: path, required: true, schema: {type: string, format: uuid}}]
  /v1/jobs/{id}/cancel:
    post:
      summary: Request cooperative cancellation
      security: [{bearer: []}]
      parameters: [{name: id, in: path, required: true, schema: {type: string, format: uuid}}]
  /v1/printers:
    get: {summary: List definitions plus configured and discovered printers, security: [{bearer: []}]}
  /v1/documents/validate:
    post: {summary: Validate a canonical or editor v4 document, security: [{bearer: []}]}
  /v1/documents/preview:
    post:
      summary: Render a canonical or editor v4 document as PNG
      security: [{bearer: []}]
      responses:
        "200": {description: PNG preview, content: {image/png: {schema: {type: string, contentEncoding: binary}}}}
  /v1/documents/export:
    post:
      summary: Export a canonical or editor v4 document as PNG or exact-geometry PDF
      security: [{bearer: []}]
      parameters:
        - {name: format, in: query, required: true, schema: {type: string, enum: [png, pdf]}}
      requestBody:
        required: true
        content: {application/json: {schema: {type: object}}}
      responses:
        "200":
          description: Encoded export
          content:
            image/png: {schema: {type: string, contentEncoding: binary}}
            application/pdf: {schema: {type: string, contentEncoding: binary}}
        "400": {description: Missing or unknown explicit format}
        "401": {description: Invalid origin-bound bearer token}
        "422": {description: Invalid or unrenderable document}
  /v1/laposte/extract:
    post: {summary: Extract occupied exact-size La Poste slots from a base64 PDF, security: [{bearer: []}]}
  /v1/assets:
    get: {summary: List locally installed private asset catalogues, security: [{bearer: []}]}
components:
  securitySchemes:
    bearer: {type: http, scheme: bearer}
  schemas:
    PairResponse:
      type: object
      required: [grantId, token, expiresAt]
      properties: {grantId: {type: string, format: uuid}, token: {type: string}, expiresAt: {type: string, format: date-time}}
    Job:
      type: object
      required: [id, state, terminal, lastCompletedAction, bytesSent, action, actions, totalBytes, phase]
      properties: {id: {type: string, format: uuid}, state: {type: string}, terminal: {type: boolean}, outcome: {type: [string, "null"]}, lastCompletedAction: {type: integer}, bytesSent: {type: integer}, action: {type: integer}, actions: {type: integer}, totalBytes: {type: integer}, phase: {type: string}}
