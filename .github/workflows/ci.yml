name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: makersbrain/mb-printer-sdk
          path: _sdk
      - run: ln -s "$GITHUB_WORKSPACE/_sdk" "$GITHUB_WORKSPACE/../mb-printer-sdk"
      - run: rustup toolchain install 1.88.0 --profile minimal --component rustfmt --component clippy && rustup default 1.88.0
      - run: test "$(rustc --version | cut -d' ' -f2)" = 1.88.0
      - run: sudo apt-get update && sudo apt-get install -y libdbus-1-dev pkg-config
      - run: cargo fmt --all --check
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo test --locked --all-targets
      - run: cargo check --locked --all-targets --all-features
      - run: cargo build --release --locked --all-features
